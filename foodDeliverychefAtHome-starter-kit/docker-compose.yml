# Local infrastructure for development and tests.
# Requires Docker Desktop in LINUX containers mode (WSL 2 backend).
# Start: docker compose up -d     Stop: docker compose down     (never add -v unless you want to wipe data)

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fdc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fdc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fdc_dev}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdc} -d ${POSTGRES_DB:-fdc_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    # Throwaway database for integration and concurrency tests (UAT-08, UAT-09). Data is not persisted.
    image: postgis/postgis:16-3.4
    container_name: fdc-db-test
    environment:
      POSTGRES_USER: fdc
      POSTGRES_PASSWORD: fdc_test_password
      POSTGRES_DB: fdc_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdc -d fdc_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fdc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
